name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS (Apple Silicon), Windows, and Linux cover all three OS families.
        # Intel macOS (macos-13) is validated at release time (see docs 09/10):
        # GitHub's free Intel runners are heavily queued and were repeatedly
        # cancelled by cancel-in-progress before they could start.
        os: [macos-14, windows-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            build-essential \
            file \
            cmake \
            clang \
            libclang-dev

      - name: Install cmake (macOS)
        if: runner.os == 'macOS'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Point bindgen at libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Run full check
        shell: bash
        run: bash scripts/check.sh

  # The real UI in a real browser, against a mocked IPC layer.
  e2e:
    name: End to end (UI)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install dependencies and browser
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: apps/desktop
        run: pnpm e2e

  # The shipped worker is a release build, and profile-dependent native bugs do
  # not show in debug. Runs the real queue, worker, and model end to end.
  real-inference:
    name: Real inference (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    env:
      MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
      MODEL_SHA256: be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21
      AUDIO_URL: https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.7.6/samples/jfk.wav

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev

      - name: Install cmake (macOS)
        if: runner.os == 'macOS'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Point bindgen at libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Target AVX2 as shipped builds do
        if: runner.arch == 'X64'
        shell: bash
        run: |
          {
            echo "GGML_NATIVE=OFF"
            echo "GGML_AVX=ON"
            echo "GGML_AVX2=ON"
            echo "GGML_FMA=ON"
            echo "GGML_F16C=ON"
          } >> "$GITHUB_ENV"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: real-inference-simd-v1

      - name: Cache test model
        uses: actions/cache@v4
        with:
          path: test-assets
          key: real-inference-${{ env.MODEL_SHA256 }}-v1.7.6

      - name: Fetch and verify test assets
        shell: bash
        run: |
          mkdir -p test-assets
          [ -f test-assets/ggml-tiny.bin ] || curl -fsSL -o test-assets/ggml-tiny.bin "$MODEL_URL"
          [ -f test-assets/jfk.wav ] || curl -fsSL -o test-assets/jfk.wav "$AUDIO_URL"
          actual=$(python3 -c "import hashlib; print(hashlib.sha256(open('test-assets/ggml-tiny.bin','rb').read()).hexdigest())")
          [ "$actual" = "$MODEL_SHA256" ]

      - name: Run the queue on a real model (release)
        shell: bash
        env:
          OAS_TEST_MODEL: ${{ github.workspace }}/test-assets/ggml-tiny.bin
          OAS_TEST_AUDIO: ${{ github.workspace }}/test-assets/jfk.wav
          OAS_TEST_JOBS: "8"
        run: cargo test --release -p oas-worker -- --nocapture
