name: Release

# Runs when a version tag is pushed, and leaves a draft for a person to publish.
# Builds are not signed by Apple or Microsoft. macOS builds carry a free ad-hoc
# signature, and packaging/release-notes.md tells people how to open them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Matches bundle.macOS.minimumSystemVersion in tauri.conf.json.
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            args: --bundles dmg
          - os: macos-15-intel
            args: --bundles dmg
          - os: windows-latest
            args: --bundles nsis,msi
          - os: ubuntu-22.04
            args: --bundles appimage,deb,rpm

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            build-essential \
            file \
            cmake \
            clang \
            libclang-dev

      - name: Install cmake (macOS)
        if: runner.os == 'macOS'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Point bindgen at libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install UI dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build and upload to a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: SynthSpeech ${{ github.ref_name }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

  licenses:
    name: Licenses and SBOM
    runs-on: ubuntu-22.04
    needs: build
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about,cargo-cyclonedx

      - name: Generate
        run: |
          cargo about generate --workspace packaging/third-party-licenses.hbs -o THIRD_PARTY_LICENSES
          cargo cyclonedx --manifest-path apps/desktop/src-tauri/Cargo.toml --format json --override-filename sbom

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" THIRD_PARTY_LICENSES apps/desktop/src-tauri/sbom.json --clobber

      - name: Add checksums and install notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release-files
          gh release download "$GITHUB_REF_NAME" --dir release-files
          (cd release-files && sha256sum * > ../SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --notes-file packaging/release-notes.md
