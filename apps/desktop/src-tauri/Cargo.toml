[package]
name = "oas-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Open Audio Studio desktop app (Tauri 2 shell)."
default-run = "oas-desktop"

[lib]
name = "oas_desktop_lib"
# Desktop-only MVP: a plain rlib. The `cdylib`/`staticlib` types that Tauri's
# mobile targets need are intentionally omitted (re-add for iOS/Android).
#
# `test`/`doctest` are disabled here and on the binaries below: tauri-build only
# applies its linker arguments to *binaries*, so a Tauri-linked test harness is
# missing imports and fails to start on Windows (STATUS_ENTRYPOINT_NOT_FOUND).
# Bindings are generated and drift-checked via the `export-bindings` binary.
crate-type = ["lib"]
test = false
doctest = false

[[bin]]
name = "oas-desktop"
path = "src/main.rs"
test = false

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oas-core.workspace = true
oas-protocol.workspace = true
oas-hardware.workspace = true
oas-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
specta = { workspace = true, features = ["derive"] }
specta-typescript.workspace = true
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
