[package]
name = "oas-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Open Audio Studio desktop app (Tauri 2 shell)."
default-run = "oas-desktop"

[lib]
name = "oas_desktop_lib"
# Desktop-only MVP: a plain rlib. The `cdylib`/`staticlib` types that Tauri's
# mobile targets need are intentionally omitted — on Windows they make
# `cargo test` load a sibling DLL and abort with STATUS_ENTRYPOINT_NOT_FOUND.
# Re-add them if/when iOS or Android becomes a target.
crate-type = ["lib"]

[[bin]]
name = "oas-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oas-core.workspace = true
oas-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
specta = { workspace = true, features = ["derive"] }
specta-typescript.workspace = true
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
