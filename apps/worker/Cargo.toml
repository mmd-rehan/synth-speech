[package]
name = "oas-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Inference worker process (Tauri sidecar). Speaks the JSONL protocol over stdio."

[[bin]]
name = "oas-worker"
path = "src/main.rs"

[features]
metal = ["oas-engine-whisper/metal"]
vulkan = ["oas-engine-whisper/vulkan"]
cuda = ["oas-engine-whisper/cuda"]

[dependencies]
oas-core.workspace = true
oas-protocol.workspace = true
oas-audio.workspace = true
oas-engine.workspace = true
oas-engine-whisper.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
oas-catalog.workspace = true
oas-hardware.workspace = true
oas-jobs.workspace = true
oas-storage.workspace = true
tempfile = "3"
