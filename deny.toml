# Dependency policy, checked in CI by `cargo deny check`.

[graph]
all-features = false

[advisories]
# Reported by Tauri's Linux stack, with no fixed release to move to. They are
# unmaintained-crate notices or do not affect how the code is used here.
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2024-0370", "RUSTSEC-2024-0429"]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
